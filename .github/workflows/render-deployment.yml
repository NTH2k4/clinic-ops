name: Render Deployment

on:
  push:
    branches:
      - main
    paths:
      - "apps/api/**"
      - "apps/web/**"
      - "render.yaml"
      - ".github/workflows/render-deployment.yml"
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

concurrency:
  group: render-deployment-${{ github.ref }}
  cancel-in-progress: true

jobs:
  render-deployment:
    name: Register Render Deployment
    runs-on: ubuntu-latest
    env:
      RENDER_EXTERNAL_URL: ${{ vars.RENDER_EXTERNAL_URL }}
      RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
    steps:
      - name: Check Render URL configuration
        run: |
          if [ -z "$RENDER_EXTERNAL_URL" ]; then
            echo "Set the RENDER_EXTERNAL_URL repository variable to the Render service URL before registering GitHub Deployments."
            exit 0
          fi

      - name: Create GitHub deployment
        if: env.RENDER_EXTERNAL_URL != ''
        uses: actions/github-script@v7
        id: deployment
        with:
          script: |
            const deployment = await github.rest.repos.createDeployment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: context.sha,
              environment: "render-free",
              auto_merge: false,
              required_contexts: [],
              transient_environment: false,
              production_environment: false,
              description: "Render free full-stack deployment URL"
            });
            core.setOutput("deployment_id", String(deployment.data.id));

      - name: Mark deployment in progress
        if: env.RENDER_EXTERNAL_URL != ''
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.repos.createDeploymentStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              deployment_id: Number("${{ steps.deployment.outputs.deployment_id }}"),
              state: "in_progress",
              environment_url: process.env.RENDER_EXTERNAL_URL,
              log_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              description: "Waiting for Render to serve this commit"
            });

      - name: Trigger Render deploy
        if: env.RENDER_EXTERNAL_URL != '' && env.RENDER_DEPLOY_HOOK_URL != ''
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --request POST "$RENDER_DEPLOY_HOOK_URL" >/dev/null

      - name: Wait for Render health
        if: env.RENDER_EXTERNAL_URL != ''
        run: |
          set -euo pipefail
          base_url="${RENDER_EXTERNAL_URL%/}"
          for attempt in $(seq 1 30); do
            if health_json="$(curl --fail --silent --show-error "$base_url/api/v1/health")"; then
              health_commit="$(node -e 'const chunks=[]; process.stdin.on("data",(chunk)=>chunks.push(chunk)); process.stdin.on("end",()=>{ try { const body=JSON.parse(Buffer.concat(chunks).toString("utf8")); process.stdout.write(body?.data?.commit ?? ""); } catch { process.stdout.write(""); } });' <<< "$health_json")"
              if [ "$health_commit" = "$GITHUB_SHA" ]; then
                echo "$health_json"
                exit 0
              fi
              echo "Render is healthy but serving commit ${health_commit:-unknown}; waiting for ${GITHUB_SHA}."
            fi
            echo "Render health check not ready for this commit yet, attempt ${attempt}/30."
            sleep 20
          done
          echo "Render health check did not report this commit within 10 minutes."
          exit 1

      - name: Mark deployment successful
        if: env.RENDER_EXTERNAL_URL != ''
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.repos.createDeploymentStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              deployment_id: Number("${{ steps.deployment.outputs.deployment_id }}"),
              state: "success",
              environment_url: process.env.RENDER_EXTERNAL_URL,
              log_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              description: "Render health reported this commit"
            });

      - name: Mark deployment failed
        if: failure() && env.RENDER_EXTERNAL_URL != ''
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.repos.createDeploymentStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              deployment_id: Number("${{ steps.deployment.outputs.deployment_id }}"),
              state: "failure",
              environment_url: process.env.RENDER_EXTERNAL_URL,
              log_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              description: "Render health check failed"
            });
