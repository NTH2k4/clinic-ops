name: Web CI

on:
  pull_request:
    branches:
      - main
    paths:
      - "apps/web/**"
      - "apps/api/**"
      - ".github/workflows/web-ci.yml"
      - ".github/workflows/web-pages.yml"
  push:
    branches:
      - main
    paths:
      - "apps/web/**"
      - "apps/api/**"
      - ".github/workflows/web-ci.yml"
      - ".github/workflows/web-pages.yml"

permissions:
  contents: read

concurrency:
  group: web-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate Web
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://careflow:careflow@localhost:5432/careflow_test
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: careflow
          POSTGRES_PASSWORD: careflow
          POSTGRES_DB: careflow_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: apps/web

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install API dependencies
        run: npm ci --prefix ../api

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run unit tests
        run: npm test -- --run

      - name: Run typecheck
        run: npm run typecheck

      - name: Run lint
        run: npm run lint

      - name: Build web app
        run: npm run build

      - name: Run E2E smoke checks
        run: npm run e2e

      - name: Run API-mode E2E regression checks
        run: npm run e2e:api

      - name: Upload web build artifact
        uses: actions/upload-artifact@v4
        with:
          name: careflow-web-dist
          path: apps/web/dist
          if-no-files-found: error
